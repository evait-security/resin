services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resin
      POSTGRES_DB: resin
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsock:/var/run/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resin"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  resin:
    build:
      context: .
      target: production
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    network_mode: host
    # Hardening: drop every Linux capability and only re-add what is needed
    # for binding privileged ports (<1024). The container cannot gain new
    # privileges via setuid binaries (there are none in the distroless
    # image anyway), the root filesystem is mounted read-only, and the
    # only writable location is the persistent /data volume plus a small
    # tmpfs for runtime scratch space.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - resin_data:/data
      - pgsock:/var/run/postgresql
    restart: unless-stopped

volumes:
  pgdata:
  resin_data:
  pgsock:

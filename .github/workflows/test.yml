name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Run tests
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
